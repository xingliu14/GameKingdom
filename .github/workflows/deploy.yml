name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via rsync over SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: 89.167.72.63
          VPS_USER: root
          REMOTE_DIR: /var/www/gamekingdom
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "Key file size: $(wc -c < ~/.ssh/id_ed25519) bytes, $(wc -l < ~/.ssh/id_ed25519) lines"
          if ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1; then
            echo "Key is a valid private key"
          else
            echo "ssh-keygen rejected the key — secret is malformed or is not a private key"
            ssh-keygen -y -f ~/.ssh/id_ed25519 2>&1 || true
          fi
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_ed25519" \
            --exclude='.git/' \
            --exclude='*.md' \
            --exclude='deploy/' \
            --exclude='.github/' \
            ./ "$VPS_USER@$VPS_HOST:$REMOTE_DIR/"
